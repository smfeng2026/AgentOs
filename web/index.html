<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>laya 决策模型测试台</title>
<style>
:root {
  --bg: #0a0c10; --bg2: #0e1117; --panel: #12151d; --panel2: #161a24;
  --line: #232836; --line2: #2d3345; --txt: #eef1f7; --dim: #8b93a7; --dim2: #5c6478;
  --acc: #7aa2ff; --acc2: #5b8def; --accsoft: rgba(122,162,255,.12);
  --good: #34d399; --warn: #fbbf24; --bad: #f87171; --mono: "SF Mono","JetBrains Mono",Consolas,monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { background: var(--bg); }
body {
  background:
    radial-gradient(1200px 500px at 85% -10%, rgba(91,141,239,.14), transparent 60%),
    radial-gradient(900px 400px at -10% 110%, rgba(52,211,153,.08), transparent 60%),
    var(--bg);
  color: var(--txt);
  font: 14px/1.65 "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  min-height: 100vh;
  padding: 28px 24px 60px;
}
.wrap { max-width: 1180px; margin: 0 auto; }

/* ---------- header ---------- */
header { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; flex-wrap: wrap; }
.logo {
  width: 42px; height: 42px; border-radius: 12px; flex: none;
  background: linear-gradient(135deg, #5b8def, #7aa2ff 55%, #34d399);
  display: flex; align-items: center; justify-content: center;
  font: 700 20px/1 var(--mono); color: #fff; box-shadow: 0 4px 18px rgba(91,141,239,.35);
}
h1 { font-size: 21px; font-weight: 700; letter-spacing: .01em; }
.sub { color: var(--dim); font-size: 12.5px; margin-top: 2px; }
.pill {
  margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap;
}
.pill span {
  font: 500 11.5px/1 var(--mono); color: var(--dim);
  border: 1px solid var(--line); background: var(--panel);
  padding: 6px 10px; border-radius: 999px; white-space: nowrap;
}
.pill b { color: var(--acc); font-weight: 600; }

/* ---------- layout ---------- */
.cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 960px) { .cols { grid-template-columns: 1fr; } }
.panel {
  background: linear-gradient(180deg, var(--panel2), var(--panel));
  border: 1px solid var(--line); border-radius: 16px; padding: 18px;
  box-shadow: 0 8px 30px rgba(0,0,0,.25);
}
.panel > h2 {
  display: flex; align-items: center; gap: 8px;
  font-size: 12px; font-weight: 600; color: var(--dim);
  text-transform: uppercase; letter-spacing: .12em; margin-bottom: 14px;
}
.panel > h2::before { content: ""; width: 6px; height: 6px; border-radius: 2px; background: var(--acc); }

/* ---------- modality tabs ---------- */
.tabs { display: flex; gap: 4px; background: var(--bg2); border: 1px solid var(--line); border-radius: 12px; padding: 4px; margin-bottom: 16px; }
.tab {
  flex: 1; text-align: center; padding: 8px 10px; border-radius: 9px; cursor: pointer;
  color: var(--dim); font-weight: 600; font-size: 13px; border: none; background: none;
  transition: all .15s ease; user-select: none;
}
.tab .ico { margin-right: 6px; }
.tab:hover { color: var(--txt); }
.tab.on { background: var(--accsoft); color: var(--acc); box-shadow: inset 0 0 0 1px rgba(122,162,255,.35); }
.tab.dis { opacity: .35; cursor: not-allowed; }
.modnote { font-size: 12px; color: var(--dim2); margin: -6px 0 14px; line-height: 1.5; }

/* ---------- inputs ---------- */
label { display: block; color: var(--dim); font-size: 12px; font-weight: 600; margin: 12px 0 5px; }
label:first-of-type { margin-top: 0; }
textarea, input[type=text], select {
  width: 100%; background: var(--bg2); color: var(--txt);
  border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
  font: inherit; resize: vertical; outline: none; transition: border-color .15s;
}
textarea:focus, input[type=text]:focus, select:focus { border-color: var(--acc2); }
textarea { min-height: 130px; line-height: 1.6; }
select { cursor: pointer; width: auto; }
input[type=file] { display: none; }

/* dropzone */
.drop {
  border: 1.5px dashed var(--line2); border-radius: 12px; padding: 26px 16px;
  text-align: center; color: var(--dim); cursor: pointer; transition: all .15s;
  margin-bottom: 4px;
}
.drop:hover { border-color: var(--acc2); color: var(--txt); background: rgba(122,162,255,.04); }
.drop .big { font-size: 26px; display: block; margin-bottom: 6px; }
.drop .t { font-size: 13px; font-weight: 600; }
.drop .hint { font-size: 11.5px; color: var(--dim2); margin-top: 3px; }
.preview-wrap { position: relative; margin-top: 10px; display: none; }
.preview-wrap img { max-width: 100%; max-height: 260px; border-radius: 10px; border: 1px solid var(--line); display: block; }
.preview-wrap audio { width: 100%; margin-top: 8px; }
.preview-wrap .fname { font: 11.5px var(--mono); color: var(--dim2); margin-top: 6px; word-break: break-all; }
.preview-wrap .x {
  position: absolute; top: 8px; right: 8px; width: 26px; height: 26px; border-radius: 8px;
  background: rgba(10,12,16,.8); border: 1px solid var(--line2); color: var(--dim);
  cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px;
}
.preview-wrap .x:hover { color: var(--bad); border-color: var(--bad); }

/* ---------- questions ---------- */
.qcard {
  border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px;
  margin-bottom: 10px; position: relative; background: var(--bg2);
}
.qcard:hover { border-color: var(--line2); }
.qhead { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.qnum { font: 600 11px var(--mono); color: var(--acc); background: var(--accsoft); padding: 3px 8px; border-radius: 6px; }
.qcard .del {
  margin-left: auto; color: var(--dim2); cursor: pointer; background: none; border: none;
  font-size: 15px; padding: 2px 6px; border-radius: 6px;
}
.qcard .del:hover { color: var(--bad); }
.crits { display: flex; gap: 6px; flex-wrap: wrap; }
.crits span { display: flex; gap: 4px; flex: 1 1 140px; align-items: center; }
.crits input { min-width: 0; }
.crits .rm { color: var(--dim2); cursor: pointer; padding: 0 4px; }
.crits .rm:hover { color: var(--bad); }
.addq { color: var(--acc); cursor: pointer; font-size: 13px; display: inline-block; margin-top: 6px; font-weight: 600; }
.addq:hover { text-decoration: underline; }

/* ---------- buttons ---------- */
.actions { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; align-items: center; }
.btn {
  background: linear-gradient(135deg, var(--acc2), var(--acc));
  color: #07111f; border: none; border-radius: 10px; padding: 10px 26px;
  font: 700 14px/1 inherit; cursor: pointer;
  box-shadow: 0 4px 16px rgba(91,141,239,.3); transition: transform .1s, box-shadow .15s;
}
.btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(91,141,239,.4); }
.btn:disabled { opacity: .5; cursor: wait; transform: none; }
.btn.sub {
  background: transparent; color: var(--dim); border: 1px solid var(--line2);
  box-shadow: none; font-weight: 600; padding: 10px 16px;
}
.btn.sub:hover { color: var(--txt); border-color: var(--dim2); }

/* ---------- examples ---------- */
.ex-title { margin: 18px 0 8px; font-size: 12px; font-weight: 600; color: var(--dim); letter-spacing: .08em; }
.ex-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.ex {
  border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; cursor: pointer;
  background: var(--bg2); transition: all .12s;
}
.ex:hover { border-color: var(--acc2); background: var(--accsoft); }
.ex .et { font-size: 12.5px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
.ex .ed { font-size: 11px; color: var(--dim2); margin-top: 2px; }

/* ---------- results ---------- */
.empty { color: var(--dim2); text-align: center; padding: 48px 12px; font-size: 13.5px; line-height: 2; }
.empty .big { font-size: 34px; display: block; opacity: .5; }
.res-head {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding-bottom: 12px; border-bottom: 1px solid var(--line); margin-bottom: 6px;
}
.res-head .ok { color: var(--good); font-weight: 700; font-size: 13px; }
.res-head .tm { font: 11.5px var(--mono); color: var(--dim2); }
.transcript { font-size: 12.5px; color: var(--dim); background: var(--bg2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin: 10px 0; line-height: 1.6; }
.transcript b { color: var(--acc); font-size: 11px; letter-spacing: .06em; }

.ans { border-top: 1px solid var(--line); padding: 14px 0 10px; }
.ans:first-of-type { border-top: none; }
.ans .qline { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.ans .qins { color: var(--dim); font-size: 12.5px; flex: 1 1 200px; min-width: 0; }
.badge {
  font-size: 10.5px; font-weight: 700; letter-spacing: .05em; padding: 3px 8px; border-radius: 6px; text-transform: uppercase;
}
.badge.choice { color: #7aa2ff; background: rgba(122,162,255,.12); }
.badge.score { color: #fbbf24; background: rgba(251,191,36,.12); }
.badge.noul { color: #34d399; background: rgba(52,211,153,.12); }
.ans .big-ans { font-size: 20px; font-weight: 800; margin: 2px 0 10px; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.ans .big-ans .val { color: var(--good); }
.ans .big-ans .val.no { color: var(--bad); }
.ans .big-ans .scale { font-size: 12px; color: var(--dim2); font-weight: 500; }
.ans .big-ans .route {
  font: 600 10.5px var(--mono); padding: 3px 8px; border-radius: 6px;
}
.route.auto { color: var(--good); background: rgba(52,211,153,.1); }
.route.review { color: var(--warn); background: rgba(251,191,36,.1); }

.bars { margin-bottom: 4px; }
.brow { display: grid; grid-template-columns: minmax(64px, 130px) 1fr 52px; gap: 10px; align-items: center; margin: 7px 0; }
.brow .bl { font-size: 12px; color: var(--dim); text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.brow .bl.win { color: var(--txt); font-weight: 700; }
.btrack { background: var(--bg2); border: 1px solid var(--line); height: 20px; border-radius: 6px; overflow: hidden; position: relative; }
.btrack i {
  position: absolute; inset: 0 auto 0 0; border-radius: 5px; display: block;
  background: linear-gradient(90deg, #33518f, #5b8def);
}
.brow.top .btrack i { background: linear-gradient(90deg, #1f9d6d, #34d399); box-shadow: 0 0 12px rgba(52,211,153,.35); }
.brow .bp { font: 600 11.5px var(--mono); color: var(--dim2); }
.brow.top .bp { color: var(--good); }
.cbar { background: var(--bg2); border: 1px solid var(--line); border-radius: 6px; height: 8px; overflow: hidden; margin-top: 10px; }
.cbar i { display: block; height: 100%; background: linear-gradient(90deg, #5b8def, #7aa2ff); border-radius: 6px; }
.cnote { display: flex; justify-content: space-between; font-size: 11px; color: var(--dim2); margin-top: 4px; }

.meta { color: var(--dim2); font-size: 11.5px; }
.err { color: var(--bad); background: rgba(248,113,113,.07); border: 1px solid rgba(248,113,113,.25); border-radius: 10px; padding: 12px 14px; margin-top: 12px; font-size: 13px; }
.loading { color: var(--acc); margin-top: 18px; font-size: 13.5px; display: flex; align-items: center; gap: 10px; }
.loading::before {
  content: ""; width: 14px; height: 14px; flex: none; border-radius: 50%;
  border: 2px solid var(--accsoft); border-top-color: var(--acc); animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
pre {
  background: var(--bg2); border: 1px solid var(--line); border-radius: 10px; padding: 12px;
  font: 11.5px/1.55 var(--mono); overflow: auto; margin-top: 12px; color: var(--dim); max-height: 340px;
}
details summary { color: var(--dim2); font-size: 11.5px; cursor: pointer; margin-top: 14px; user-select: none; }
details summary:hover { color: var(--dim); }
footer { margin-top: 26px; color: var(--dim2); font-size: 11.5px; text-align: center; }
footer a { color: var(--dim); text-decoration: none; }
footer a:hover { color: var(--acc); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">L</div>
    <div>
      <h1>laya 决策模型测试台</h1>
      <div class="sub">输入场景,提出「单选 / 评分 / 是非」问题,秒级返回校准概率</div>
    </div>
    <div class="pill" id="info"></div>
  </header>

  <div class="cols">
    <!-- ================= 输入面板 ================= -->
    <div class="panel">
      <h2>输入</h2>
      <div class="tabs" id="tabs">
        <button class="tab on" data-mod="text" onclick="setMod('text', this)"><span class="ico">✎</span>文本</button>
        <button class="tab" data-mod="image" onclick="setMod('image', this)"><span class="ico">🖼</span>图片</button>
        <button class="tab" data-mod="audio" onclick="setMod('audio', this)"><span class="ico">🎙</span>音频</button>
        <button class="tab" data-mod="video" onclick="setMod('video', this)"><span class="ico">🎬</span>视频</button>
      </div>
      <div class="modnote" id="modnote"></div>

      <div id="mod-text">
        <label>状态文本(state)—— 描述场景或上下文</label>
        <textarea id="state" placeholder="例如:客户来信,发票被重复扣款,要求今天退款,否则取消套餐…"></textarea>
      </div>
      <div id="mod-media" style="display:none">
        <label>上传文件(图片 / 音频 / 视频)</label>
        <div class="drop" id="drop" onclick="document.getElementById('file').click()">
          <span class="big">📁</span>
          <span class="t">点击选择,或把文件拖到这里</span>
          <span class="hint" id="drop-hint">支持 PNG / JPG / WebP · MP3 / WAV / M4A · MP4 / MOV</span>
        </div>
        <input type="file" id="file" accept="image/*,audio/*,video/*">
        <div class="preview-wrap" id="pv">
          <div id="pv-body"></div>
          <div class="fname" id="fname"></div>
          <button class="x" onclick="clearFile()">✕</button>
        </div>
      </div>

      <h2 style="margin-top:20px">决策问题</h2>
      <div id="questions"></div>
      <span class="addq" onclick="addQuestion()">+ 添加问题</span>

      <div class="ex-title">中文示例(点击填充)</div>
      <div class="ex-grid" id="examples"></div>

      <div class="actions">
        <button class="btn" id="go" onclick="run()">运行预测</button>
        <button class="btn sub" onclick="resetAll()">清空</button>
      </div>
    </div>

    <!-- ================= 结果面板 ================= -->
    <div class="panel">
      <h2>结果</h2>
      <div id="out"><div class="empty"><span class="big">🎯</span>左侧填好后点「运行预测」<br>或先点一个示例快速体验</div></div>
      <div id="raw"></div>
    </div>
  </div>

  <footer>
    模型 <a href="https://huggingface.co/convaiinnovations/laya" target="_blank">convaiinnovations/laya</a> ·
    源码 <a href="https://github.com/NandhaKishorM/laya" target="_blank">NandhaKishorM/laya</a> · Apache-2.0
  </footer>
</div>

<script>
/* ============ 模态 ============ */
const MODS = {
  text:  { note: '纯文本输入。当前 laya 英文 checkpoint,CPU fp16,单次前向同时回答所有问题。' },
  image: { note: '需 vega 多模态引擎(0.8B reader,本机约 2GB 内存)。首次使用需下载模型,请耐心等待。' },
  audio: { note: '需 vega 多模态引擎。语音先转写、再决策;多语言转写默认 whisper-small。' },
  video: { note: '需 vega 多模态引擎。有声轨则转写决策,无声则抽取关键帧走图片路径。' },
};
let MOD = 'text';
let FILE = null;

function setMod(m, el) {
  MOD = m;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t === el));
  document.getElementById('modnote').textContent = MODS[m].note;
  document.getElementById('mod-text').style.display = m === 'text' ? '' : 'none';
  document.getElementById('mod-media').style.display = m === 'text' ? 'none' : '';
  if (m !== 'text' && vegaAvail === false) {
    document.getElementById('modnote').innerHTML = '⚠️ vega 引擎未就绪:<span style="color:var(--warn)">' + vegaMsg + '</span>';
  }
}

/* ============ 文件上传 ============ */
const fileEl = document.getElementById('file');
fileEl.onchange = () => { if (fileEl.files[0]) setFile(fileEl.files[0]); };
const drop = document.getElementById('drop');
drop.ondragover = e => { e.preventDefault(); drop.style.borderColor = 'var(--acc2)'; };
drop.ondragleave = () => drop.style.borderColor = '';
drop.ondrop = e => {
  e.preventDefault(); drop.style.borderColor = '';
  if (e.dataTransfer.files[0]) setFile(e.dataTransfer.files[0]);
};
function setFile(f) {
  const kind = f.type.split('/')[0];
  if (MOD !== kind) return alert('当前标签页是「' + MODTEXT[MOD] + '」,请切换到「' + MODTEXT[kind] + '」标签再上传');
  FILE = f;
  const pv = document.getElementById('pv'), body = document.getElementById('pv-body');
  if (kind === 'image') body.innerHTML = '<img src="' + URL.createObjectURL(f) + '">';
  else if (kind === 'audio') body.innerHTML = '<audio controls src="' + URL.createObjectURL(f) + '"></audio>';
  else if (kind === 'video') body.innerHTML = '<video controls style="max-width:100%;max-height:260px;border-radius:10px" src="' + URL.createObjectURL(f) + '"></video>';
  document.getElementById('fname').textContent = f.name + ' · ' + fmtSize(f.size);
  pv.style.display = 'block';
}
function clearFile() {
  FILE = null; fileEl.value = '';
  document.getElementById('pv').style.display = 'none';
}
const MODTEXT = { text: '文本', image: '图片', audio: '音频', video: '视频' };
const fmtSize = b => b > 1048576 ? (b / 1048576).toFixed(1) + ' MB' : (b / 1024).toFixed(0) + ' KB';

/* ============ 问题卡片 ============ */
const QTYPES = { choice: '单选 choice', score: '评分 score', noul: '是非 noul' };

function addQuestion(type = 'choice', ins = '', crits = []) {
  const wrap = document.getElementById('questions');
  const card = document.createElement('div');
  card.className = 'qcard';
  card.innerHTML = `
    <div class="qhead"><span class="qnum">Q</span>
      <select class="qtype">
        ${Object.entries(QTYPES).map(([k, v]) => `<option value="${k}" ${k === type ? 'selected' : ''}>${v}</option>`).join('')}
      </select>
      <button class="del" title="删除">×</button>
    </div>
    <label>问题指令</label>
    <input type="text" class="qins" value="${esc(ins)}" placeholder="例如:这封邮件应由哪个部门处理?">
    <label class="critlabel">候选选项</label>
    <div class="crits"></div>
    <span class="addq critadd">+ 候选</span>`;
  card.querySelector('.del').onclick = () => { card.remove(); renum(); };
  const critsEl = card.querySelector('.crits');
  const addCrit = (v = '') => {
    const row = document.createElement('span');
    row.innerHTML = `<input type="text" class="crit" value="${esc(v)}" placeholder="候选">`;
    const rm = document.createElement('span');
    rm.className = 'rm'; rm.textContent = '×';
    rm.onclick = () => row.remove();
    row.appendChild(rm);
    critsEl.appendChild(row);
  };
  card.querySelector('.critadd').onclick = () => addCrit();
  crits.forEach(c => addCrit(c));
  const syncCritUi = () => {
    const isNoul = card.querySelector('.qtype').value === 'noul';
    card.querySelector('.critlabel').style.display = isNoul ? 'none' : '';
    critsEl.style.display = isNoul ? 'none' : 'flex';
    card.querySelector('.critadd').style.display = isNoul ? 'none' : 'inline-block';
    if (isNoul) critsEl.innerHTML = '';
    else if (!critsEl.children.length) { addCrit(); addCrit(); }
  };
  card.querySelector('.qtype').onchange = syncCritUi;
  syncCritUi();
  wrap.appendChild(card);
  renum();
}
function renum() {
  document.querySelectorAll('.qcard').forEach((c, i) => c.querySelector('.qnum').textContent = 'Q' + (i + 1));
}

function collect() {
  const questions = {};
  for (const card of document.querySelectorAll('.qcard')) {
    const ins = card.querySelector('.qins').value.trim();
    if (!ins) throw new Error('有问题未填写指令');
    const type = card.querySelector('.qtype').value;
    const qid = 'q' + (Object.keys(questions).length + 1);
    if (type === 'noul') { questions[qid] = { type, instructions: ins }; continue; }
    const crits = [...card.querySelectorAll('.crit')].map(c => c.value.trim()).filter(Boolean);
    if (crits.length < 2) throw new Error(`「${ins}」至少需要 2 个候选`);
    questions[qid] = { type, instructions: ins, criteria: crits };
  }
  if (!Object.keys(questions).length) throw new Error('至少添加一个问题');
  return questions;
}

/* ============ 中文示例 ============ */
const EXAMPLES = [
  { icon: '💰', title: '客服工单分流', desc: '英文邮件·3 问', state: 'Hi, we were billed twice for March. Please refund the duplicate today or we will cancel our plan.', qs: [
    { type: 'choice', ins: 'Which department should handle this?', crits: ['billing', 'technical', 'other'] },
    { type: 'score', ins: 'How urgent is this?', crits: ['not urgent', 'soon', 'blocking'] },
    { type: 'noul', ins: 'Does the user threaten to cancel or leave?' },
  ]},

function fillExample(i) {
  const ex = EXAMPLES[i];
  setMod('text', document.querySelector('.tab[data-mod="text"]'));
  document.getElementById('state').value = ex.state;
  document.getElementById('questions').innerHTML = '';
  ex.qs.forEach(q => addQuestion(q.type, q.ins, q.crits || []));
}
function renderExamples() {
  const g = document.getElementById('examples');
  g.innerHTML = '';
  EXAMPLES.forEach((ex, i) => {
    const d = document.createElement('div');
    d.className = 'ex';
    d.innerHTML = `<div class="et">${ex.icon} ${ex.title}</div><div class="ed">${ex.desc}</div>`;
    d.onclick = () => fillExample(i);
    g.appendChild(d);
  });
}

/* ============ 运行 ============ */
async function run() {
  const out = document.getElementById('out'), raw = document.getElementById('raw'), btn = document.getElementById('go');
  let questions;
  try { questions = collect(); }
  catch (e) { out.innerHTML = `<div class="err">${e.message}</div>`; return; }

  const fd = new FormData();
  if (MOD === 'text') {
    fd.append('state', document.getElementById('state').value);
    if (!fd.get('state').trim()) { out.innerHTML = '<div class="err">请输入状态文本,或点一个示例填充</div>'; return; }
  } else {
    if (!FILE) { out.innerHTML = `<div class="err">请先上传一个${MODTEXT[MOD]}文件</div>`; return; }
    fd.append('file', FILE);
  }
  fd.append('questions', JSON.stringify(questions));
  btn.disabled = true;
  const t0 = performance.now();
  out.innerHTML = '<div class="loading">推理中…(CPU 上约需数秒)</div>';
  raw.innerHTML = '';
  try {
    const r = await fetch('/api/predict', { method: 'POST', body: fd });
    const d = await r.json();
    if (!r.ok) throw new Error(typeof d.detail === 'string' ? d.detail : JSON.stringify(d.detail));
    render(d, Math.round(performance.now() - t0));
  } catch (e) {
    out.innerHTML = `<div class="err">${esc(e.message)}</div>`;
  } finally { btn.disabled = false; }
}

/* ============ 渲染 ============ */
function render(d, netMs) {
  const answers = d.result.answers || {};
  let html = `<div class="res-head"><span class="ok">✓ 完成</span>
    <span class="tm">模型 ${d.ms}ms · 网络往返 ${netMs}ms</span></div>`;
  if (d.transcript) html += `<div class="transcript"><b>语音转写</b><br>${esc(d.transcript)}</div>`;
  if (d.video_note) html += `<div class="transcript"><b>视频路径</b><br>${esc(d.video_note)}</div>`;
  const u = d.result.usage || {};
  html += `<div class="meta" style="margin-bottom:4px">tokens:${u.input_tokens ?? '-'} · 状态:${u.state_tokens ?? '-'}${u.truncated ? ' · <span style="color:var(--warn)">已截断</span>' : ''}</div>`;
  const insMap = {};
  for (const card of document.querySelectorAll('.qcard')) {
    const t = card.querySelector('.qins');
    if (t) insMap['q' + (Object.keys(insMap).length + 1)] = t.value;
  }
  for (const [qid, a] of Object.entries(answers)) {
    const qins = insMap[qid] || '';
    html += `<div class="ans"><div class="qline"><span class="badge ${a.type}">${a.type}</span><span class="qins">${esc(qins)}</span></div>`;
    if (a.type === 'choice') html += `<div class="big-ans"><span class="val">「${esc(a.choice)}」</span></div>`;
    else if (a.type === 'score') {
      const n = Object.keys(a.legend || {}).length - 1;
      html += `<div class="big-ans"><span class="val">${(+a.score).toFixed(2)}</span><span class="scale">/ ${n} · ${esc((a.legend || {})[String(Math.round(+a.score))] || '')}</span></div>`;
    } else {
      html += `<div class="big-ans"><span class="val ${a.noul > .5 ? '' : 'no'}">${a.noul > .5 ? '是' : '否'}</span><span class="scale">p = ${a.noul}</span></div>`;
    }
    if (a.route) html += `<span class="route ${a.route}">route: ${a.route}</span> `;
    const probs = Object.entries(a.probabilities || {}).sort((x, y) => y[1] - x[1]);
    const legend = a.legend || {};
    const top = probs[0] && probs[0][0];
    html += '<div class="bars">';
    for (const [k, v] of probs) {
      const label = a.type === 'score' ? (legend[k] || k) : k;
      html += bar(label, v, k === top);
    }
    html += '</div>';
    const conf = a.answer_confidence ?? a.confidence;
    if (conf != null) html += `<div class="cbar"><i style="width:${conf * 100}%"></i></div><div class="cnote"><span>答案置信度</span><span>${(+conf).toFixed(4)}</span></div>`;
    html += '</div>';
  }
  document.getElementById('out').innerHTML = html;
  document.getElementById('raw').innerHTML = `<details><summary>原始 JSON</summary><pre>${esc(JSON.stringify(d, null, 2))}</pre></details>`;
}
let collectCache = null;
function bar(label, v, isTop) {
  const pct = Math.round(v * 1000) / 10;
  return `<div class="brow ${isTop ? 'top' : ''}"><span class="bl ${isTop ? 'win' : ''}">${esc(label)}</span><div class="btrack"><i style="width:${Math.max(pct, .8)}%"></i></div><span class="bp">${pct.toFixed(1)}%</span></div>`;
}
function bar(label, v, isTop) {
  const pct = Math.round(v * 1000) / 10;
  return `<div class="brow ${isTop ? 'top' : ''}"><span class="bl ${isTop ? 'win' : ''}">${esc(label)}</span><div class="btrack"><i style="width:${Math.max(pct, .8)}%"></i></div><span class="bp">${pct.toFixed(1)}%</span></div>`;
}
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

function resetAll() {
  document.getElementById('state').value = '';
  document.getElementById('questions').innerHTML = '';
  addQuestion();
  clearFile();
  document.getElementById('out').innerHTML = '<div class="empty"><span class="big">🎯</span>左侧填好后点「运行预测」<br>或先点一个示例快速体验</div>';
  document.getElementById('raw').innerHTML = '';
}
